; /etc/supervisor/conf.d/radar-queue-worker.conf
; Sem este worker, a varredura fica presa em "queued" pra sempre.
; --max-time recicla o processo a cada hora (evita vazamento de memória
; no VPS de 1 GB); deploy/deploy.sh pede reinício gracioso via queue:restart.
[program:radar-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/monthly-radar/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/var/www/monthly-radar
user=deploy
; log do dia criado pelo worker precisa ser gravável pelo www-data (PHP-FPM)
umask=002
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/monthly-radar/storage/logs/queue-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=3600
