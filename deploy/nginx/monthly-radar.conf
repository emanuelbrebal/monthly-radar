# /etc/nginx/sites-available/monthly-radar
# Troque SEU-SUBDOMINIO pelo seu subdomínio DuckDNS. O Certbot (passo de HTTPS
# em docs/07-deploy.md) acrescenta o bloco 443 e o redirect 80 → 443 sozinho.
server {
    listen 80;
    server_name SEU-SUBDOMINIO.duckdns.org;
    root /var/www/monthly-radar/public;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets do Vite têm hash no nome: cache longo é seguro.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
